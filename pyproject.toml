[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "divoom-minitoo-codex"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Display Codex usage limits on Divoom MiniToo and TimeBox Mini devices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "zstandard>=0.22"]

[project.scripts]
codex-minitoo = "divoom_minitoo_codex.cli:main"
divoom-codex = "divoom_minitoo_codex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
divoom_minitoo_codex = ["assets/*.png"]
